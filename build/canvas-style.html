<style>
  :root{
    --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F6F1E8;
    --ink:#241F1B; --ink-2:#6B5F54; --ink-3:#A2937F;
    --line:#E9E1D4; --grid:#EAE1D2; --band:#F3EDE1; --band-line:#DFD4C2;
    --ok:#3E7C59; --ok-soft:#E6EEE7;
    --warn:#B67C17; --warn-soft:#F5E9CF;
    --bad:#C1443C; --bad-soft:#F6DED8;
    --target:#8C5A2B;
    --shadow:0 1px 2px rgba(60,45,30,.06), 0 6px 20px -12px rgba(60,45,30,.18);
    --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17130F; --surface:#211A14; --surface-2:#1C1610;
      --ink:#F3ECE0; --ink-2:#BCAF9D; --ink-3:#877A69;
      --line:#332A21; --grid:#2C241C; --band:#211A13; --band-line:#3A3025;
      --ok:#7FB894; --ok-soft:#222E26;
      --warn:#E0AE52; --warn-soft:#33281485;
      --bad:#E58072; --bad-soft:#3A211C;
      --target:#C79A6A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F6F1E8;
    --ink:#241F1B; --ink-2:#6B5F54; --ink-3:#A2937F;
    --line:#E9E1D4; --grid:#EAE1D2; --band:#F3EDE1; --band-line:#DFD4C2;
    --ok:#3E7C59; --ok-soft:#E6EEE7; --warn:#B67C17; --warn-soft:#F5E9CF;
    --bad:#C1443C; --bad-soft:#F6DED8; --target:#8C5A2B;
    --shadow:0 1px 2px rgba(60,45,30,.06), 0 6px 20px -12px rgba(60,45,30,.18);
  }
  :root[data-theme="dark"]{
    --bg:#17130F; --surface:#211A14; --surface-2:#1C1610;
    --ink:#F3ECE0; --ink-2:#BCAF9D; --ink-3:#877A69;
    --line:#332A21; --grid:#2C241C; --band:#211A13; --band-line:#3A3025;
    --ok:#7FB894; --ok-soft:#222E26; --warn:#E0AE52; --warn-soft:#33281485;
    --bad:#E58072; --bad-soft:#3A211C; --target:#C79A6A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 22px 72px;}

  header.top{margin-bottom:26px;}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  h1{font-size:clamp(26px,4.4vw,38px);line-height:1.05;letter-spacing:-.02em;font-weight:800;
    margin:8px 0 6px;text-wrap:balance;}
  .lede{color:var(--ink-2);font-size:15.5px;max-width:60ch;margin:0;}

  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;box-shadow:var(--shadow);min-width:110px;}
  .stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;}
  .stat .k{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:600;}
  .stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)} .stat.ok .n{color:var(--ok)}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:22px 0 8px;
    padding-bottom:14px;border-bottom:1px solid var(--line);}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
  .seg button{font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);background:transparent;
    border:0;padding:6px 13px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .seg button:focus-visible{outline:2px solid var(--target);outline-offset:2px;}
  .legend{display:flex;flex-wrap:wrap;gap:14px 16px;margin-left:auto;font-size:12px;color:var(--ink-2);align-items:center;}
  .legend .it{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:14px;height:12px;border-radius:3px;display:inline-block;}
  .chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none;}
  .chk input{accent-color:var(--target);width:15px;height:15px;}

  /* axis */
  .axis{display:grid;grid-template-columns:var(--labelw) 1fr;align-items:end;margin:18px 0 2px;
    position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5;padding-top:6px;}
  .axis .track-head{position:relative;height:18px;}
  .axis .tk{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap;}
  .axis .tk.strong{color:var(--target);font-weight:700;}

  /* city group */
  .city{margin-top:22px;}
  .city-head{display:flex;align-items:center;gap:10px;margin:0 0 9px;padding-left:2px;}
  .city-dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cx) 22%,transparent);}
  .city-name{font-size:14.5px;font-weight:800;letter-spacing:-.01em;}
  .city-meta{font-size:11.5px;color:var(--ink-3);font-weight:600;}
  .city-meta b{color:var(--bad);font-weight:800;}
  .city-body{border-left:3px solid var(--cx);padding-left:12px;display:flex;flex-direction:column;gap:2px;}

  /* day row */
  .row{display:grid;grid-template-columns:var(--labelw) 1fr;align-items:center;gap:0;
    padding:5px 0;border-radius:9px;transition:background .12s;}
  .row:hover{background:var(--surface-2);}
  .row .lbl{padding-right:12px;min-width:0;}
  .row .d{font-size:13px;font-weight:700;letter-spacing:-.01em;}
  .row .dt{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stops{display:inline-block;font-size:10px;font-weight:700;color:var(--ink-2);background:var(--surface-2);
    border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-top:3px;font-variant-numeric:tabular-nums;}

  .track{position:relative;height:30px;border-radius:7px;
    background:
      linear-gradient(90deg,transparent 0 var(--sanea),var(--band) var(--sanea) var(--saneb),transparent var(--saneb) 100%);
    outline:1px solid transparent;}
  .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);}
  .gl.mid{background:var(--band-line);}
  .gl.tgt{background:repeating-linear-gradient(var(--target) 0 4px,transparent 4px 8px);width:2px;opacity:.8;}
  .bar{position:absolute;top:6px;height:18px;border-radius:5px;display:flex;align-items:center;
    min-width:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .bar.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 55%,transparent);}
  .bar.moderate{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);}
  .bar.severe{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent);}
  .bar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px 0 0 5px;}
  .bar.ok .fill{background:var(--ok);opacity:.85;}
  .bar.moderate .fill{background:var(--warn);opacity:.9;}
  .bar.severe .fill{background:var(--bad);opacity:.9;}
  .overflow{position:absolute;top:6px;height:18px;border-radius:0 5px 5px 0;
    background:repeating-linear-gradient(45deg,var(--bad) 0 3px,color-mix(in srgb,var(--bad) 55%,transparent) 3px 7px);
    box-shadow:inset 0 0 0 1px var(--bad);}
  .meal{position:absolute;top:4px;height:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
  .meal .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--surface);margin-top:3.5px;}
  .meal .ml{font-size:8px;font-weight:800;color:var(--ink-3);line-height:1;margin-top:1px;}
  .endlbl{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;
    font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap;}
  .fix{grid-column:2;font-size:12px;color:var(--ink-2);padding:1px 0 6px 2px;max-width:70ch;}
  .fix::before{content:"→ ";color:var(--bad);font-weight:800;}
  .row.ok-day .lbl .d{color:var(--ink-2);}
  body.hide-fix .fix{display:none;}
  body.only-bad .row.ok-day,body.only-bad .city.empty{display:none;}

  .foot{margin-top:34px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px;max-width:70ch;}
  @media (max-width:600px){
    .wrap{padding:22px 14px 60px;}
    .legend{margin-left:0;width:100%;}
    .endlbl{font-size:10px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
